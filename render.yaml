# Blueprint de Render: panel web (React + Vite) como sitio estático.
# Render → New → Blueprint → este repositorio, rama dev_nesp.
services:
  - type: web
    runtime: static
    name: aiko-web
    branch: dev_nesp
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Solo recompila cuando cambia el frontend.
    buildFilter:
      paths:
        - frontend/**
    envVars:
      # Vite incrusta estas variables al compilar: si cambian, hay que
      # volver a desplegar.
      - key: VITE_API_URL
        value: https://ai-ko-dev-by-alfo-nica.vercel.app/v1
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      # SPA con BrowserRouter: toda ruta sirve index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
