# App móvil (Flutter): análisis y pruebas en cada push; en main además se
# compila el APK y se publica como Release descargable desde el repositorio.
name: App móvil · APK

on:
  push:
    branches: [main, dev_nesp]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  API_BASE_URL: https://ai-ko-dev-by-alfo-nica.vercel.app/v1
  HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Misma versión que el equipo de desarrollo (macOS 13 no corre
          # Flutter 3.38+). Al subirla, regenerar android/ con esa versión.
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Preparar proyecto Android
        # android/ no está versionado: se genera y se ajusta el manifiesto.
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org co.edu.amigo --project-name aiko_mobile .
          fi
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MANIFEST" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          sed -i 's#android:label="aiko_mobile"#android:label="AiKO"#' "$MANIFEST"

      - name: Configuración de Firebase
        # google-services.json no se versiona (repo público): viene del secreto.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            # Acepta el JSON tal cual o en base64 (con o sin saltos de línea,
            # comillas o BOM). Si no se puede leer, se compila sin push.
          python3 - <<'PY'
          import base64, binascii, json, os, sys
          raw = os.environ["GOOGLE_SERVICES_JSON"].strip().lstrip("\ufeff").strip("'\"").strip()
          def clean(value):
              # Ningún valor del google-services.json lleva espacios: quita
              # saltos de línea o tabs que se cuelan al copiar y pegar.
              if isinstance(value, str):
                  return "".join(value.split())
              if isinstance(value, list):
                  return [clean(v) for v in value]
              if isinstance(value, dict):
                  return {k: clean(v) for k, v in value.items()}
              return value
          def parse(text):
              try:
                  data = json.loads(text, strict=False)
                  return clean(data) if isinstance(data, dict) and "project_info" in data else None
              except ValueError:
                  return None
          data = parse(raw)
          if data is None:
              compact = "".join(raw.split())
              for decode in (base64.b64decode, base64.urlsafe_b64decode):
                  try:
                      data = parse(decode(compact + "=" * (-len(compact) % 4)).decode("utf-8-sig"))
                  except (binascii.Error, ValueError):
                      data = None
                  if data:
                      break
          if data is None:
              # Diagnóstico sin mostrar el contenido del secreto.
              try:
                  other = json.loads(raw, strict=False)
              except ValueError:
                  other = None
              if isinstance(other, dict) and other.get("type") == "service_account":
                  print("::warning::GOOGLE_SERVICES_JSON tiene la CUENTA DE SERVICIO (esa va en Vercel como FIREBASE_SERVICE_ACCOUNT_JSON). Aquí va el google-services.json de la app Android. El APK se compila sin push.")
              else:
                  print("::warning::GOOGLE_SERVICES_JSON no es un google-services.json válido (ni en texto ni en base64). El APK se compila sin notificaciones push.")
                  # Pistas que no revelan el contenido del secreto.
                  hints = [f"{len(raw)} caracteres", f"{raw.count(chr(10)) + 1} líneas",
                           f"empieza con {raw[:1]!r}", f"termina con {raw[-1:]!r}"]
                  try:
                      json.loads(raw)
                  except ValueError as error:
                      hints.append(f"error JSON: {getattr(error, 'msg', error)} (línea {getattr(error, 'lineno', '?')}, columna {getattr(error, 'colno', '?')})")
                  if isinstance(other, dict):
                      hints.append(f"claves: {sorted(other)[:8]}")
                  if any(q in raw for q in "\u201c\u201d"):
                      hints.append("tiene comillas tipográficas “ ” (se pegó desde un editor de texto enriquecido)")
                  print("::warning::Diagnóstico de GOOGLE_SERVICES_JSON: " + "; ".join(hints))
              sys.exit(0)
          # La app Android registrada en Firebase debe tener el mismo paquete.
          package = "co.edu.amigo.aiko_mobile"
          clients = data.get("client", [])
          client = next((c for c in clients
                         if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == package), None)
          if client is None:
              found = [c.get("client_info", {}).get("android_client_info", {}).get("package_name") for c in clients]
              print(f"::warning::El google-services.json no tiene la app Android '{package}' (tiene: {found}). Regístrala en Firebase con ese paquete. El APK se compila sin push.")
              sys.exit(0)
          with open("android/app/google-services.json", "w") as f:
              json.dump(data, f)
          # Lo mismo que hace el plugin de Google Services: deja los valores
          # como recursos para que Firebase.initializeApp() los encuentre.
          from xml.sax.saxutils import escape
          info = data["project_info"]
          key = (client.get("api_key") or [{}])[0].get("current_key", "")
          values = {
              "google_app_id": client["client_info"]["mobilesdk_app_id"],
              "gcm_defaultSenderId": info.get("project_number", ""),
              "google_api_key": key,
              "google_crash_reporting_api_key": key,
              "project_id": info.get("project_id", ""),
              "google_storage_bucket": info.get("storage_bucket", ""),
          }
          web = next((o for o in client.get("oauth_client", []) if o.get("client_type") == 3), None)
          if web:
              values["default_web_client_id"] = web.get("client_id", "")
          os.makedirs("android/app/src/main/res/values", exist_ok=True)
          with open("android/app/src/main/res/values/firebase_values.xml", "w") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n')
              for name, value in values.items():
                  if value:
                      f.write(f'    <string name="{name}" translatable="false">{escape(str(value))}</string>\n')
              f.write("</resources>\n")
          print(f"Firebase activado para {package} (proyecto {info.get('project_id')})")
          PY
          else
            echo "::notice::Sin el secreto GOOGLE_SERVICES_JSON el APK se compila sin notificaciones push."
          fi

      - run: flutter pub get

      - name: Ícono y pantalla de arranque
        # Desde assets/brand/ (configuración en pubspec.yaml).
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Analizar
        # Cada problema se publica como anotación (visible en la ejecución).
        run: |
          set +e
          dart analyze --format=machine --fatal-infos > analyze.txt 2>&1
          status=$?
          cat analyze.txt
          awk -F'|' 'NF>=8 { lvl = ($1=="INFO") ? "notice" : (($1=="WARNING") ? "warning" : "error"); f=$4; sub(".*/mobile/", "mobile/", f); printf "::%s file=%s,line=%s,col=%s::%s (%s)\n", lvl, f, $5, $6, $8, $3 }' analyze.txt
          exit $status

      - name: Pruebas
        # Las pruebas que fallan se publican como anotaciones.
        run: |
          set +e
          flutter test --reporter expanded > test.txt 2>&1
          status=$?
          cat test.txt
          if [ $status -ne 0 ]; then
            grep -E -A3 "\[E\]|Expected:|Actual:|Which:|^The following" test.txt | grep -v "^--$" \
              | head -40 | sed 's/^/::error title=Prueba fallida::/'
          fi
          exit $status

      - name: Compilar APK
        run: |
          flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL
          cp build/app/outputs/flutter-apk/app-release.apk build/aiko.apk

      - name: Firmar con la llave del proyecto
        # Con la misma llave, cada APK nuevo se instala encima del anterior.
        # Sin el secreto queda firmado con una llave de depuración temporal.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aiko.jks"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/aiko.jks" \
            --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" build/aiko.apk
          "$APKSIGNER" verify build/aiko.apk
          rm "$RUNNER_TEMP/aiko.jks"

      - name: Guardar APK (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: aiko-apk-${{ github.ref_name }}-${{ github.run_number }}
          path: mobile/build/aiko.apk
          retention-days: 14

      - name: Publicar Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: AiKO · APK ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: mobile/build/aiko.apk
          body: |
            APK de la app móvil de AiKO (rol Paciente) compilado desde `main` (${{ github.sha }}).

            **Instalar:** descarga `aiko.apk` en el celular y ábrelo (permite "instalar apps desconocidas" si lo pide).
            API: ${{ env.API_BASE_URL }}
